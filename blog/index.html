<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LHZZMMVRMJ"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-LHZZMMVRMJ');</script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Practical AI for UK Small Businesses | AIWorks</title>
  <meta name="description" content="Practical guides on AI tools, GEO and automation for UK small businesses. No jargon, no hype — just what works.">
  <link rel="canonical" href="https://agentsatwork.co/blog/">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--hero-bg:#0B1A10;--bg:#F9F7F3;--surface:#FFF;--border:#E8E3DA;--ink:#1A1814;--mid:#7A7568;--dim:#B8B2A8;--green:#1F6644;--green-bg:#EAF2ED;--shadow:0 2px 24px rgba(0,0,0,.07)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Geist',sans-serif;font-weight:300;background:var(--bg);color:var(--ink);line-height:1.65}
    nav{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;max-width:1180px;margin:0 auto;border-bottom:1px solid var(--border)}
    .logo{font-family:'Instrument Serif',serif;font-size:1.3rem;color:var(--ink);text-decoration:none}
    .logo span{color:var(--green);font-style:italic}
    .nav-a{font-size:.82rem;color:var(--mid);text-decoration:none}
    header{max-width:760px;margin:0 auto;padding:64px 24px 8px}
    .eyebrow{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--green)}
    h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(2rem,5vw,3rem);margin:12px 0 10px}
    .sub{color:var(--mid);max-width:520px}
    main{max-width:760px;margin:0 auto;padding:40px 24px 96px;display:grid;gap:18px}
    .card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px 28px;text-decoration:none;color:inherit;transition:box-shadow .2s}
    .card:hover{box-shadow:var(--shadow)}
    .card .date{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
    .card h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.45rem;margin:8px 0 8px}
    .card p{font-size:.92rem;color:var(--mid)}
    .card .more{display:inline-block;margin-top:12px;font-size:.85rem;color:var(--green)}
    footer{border-top:1px solid var(--border);padding:26px 24px;text-align:center;font-size:.8rem;color:var(--dim)}
    footer a{color:var(--mid);text-decoration:none}
  </style>
</head>
<body>
<nav>
  <a class="logo" href="/">ai<span>works</span></a>
  <span><a class="nav-a" href="/geo-scan.html">Free GEO scan &rarr;</a></span>
</nav>
<header>
  <p class="eyebrow">The AIWorks blog</p>
  <h1>Practical AI for small businesses</h1>
  <p class="sub">Guides on AI tools, visibility in AI answers, and automation that actually pays for itself. Written for UK SME owners, not engineers.</p>
</header>
<main id="posts"><p style="color:var(--dim)">Loading articles&hellip;</p></main>
<footer>&copy; AIWorks &middot; <a href="/privacy.html">Privacy</a> &middot; <a href="/contact.html">Contact</a></footer>
<script>
fetch('/content/posts.json').then(r => r.json()).then(posts => {
  const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'});
  const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
  document.getElementById('posts').innerHTML = posts.map(p =>
    '<a class="card" href="/blog/' + encodeURIComponent(p.slug) + '.html">' +
    '<span class="date">' + fmt(p.date) + '</span>' +
    '<h2>' + esc(p.title) + '</h2>' +
    '<p>' + esc(p.description) + '</p>' +
    '<span class="more">Read article &rarr;</span></a>'
  ).join('');
}).catch(() => { document.getElementById('posts').innerHTML = '<p style="color:var(--dim)">Could not load articles. <a href="/blog/ai-tools-for-small-businesses.html">Read our latest guide instead &rarr;</a></p>'; });
</script>
</body>
</html>
