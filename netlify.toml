[build]
  functions = "netlify/functions"

[functions."content-loop"]
  schedule = "0 * * * *"

[[redirects]]
  from = "/api/claude"
  to = "/.netlify/functions/claude-proxy"
  status = 200

[[redirects]]
  from = "/api/waitlist"
  to = "/.netlify/functions/waitlist"
  status = 200

[[redirects]]
  from = "/api/waitlist-count"
  to = "/.netlify/functions/waitlist-count"
  status = 200

[[redirects]]
  from = "/api/geo-scan"
  to = "/.netlify/functions/geo-scan"
  status = 200

[[redirects]]
  from = "/api/offers"
  to = "/.netlify/functions/offers"
  status = 200

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/onboarding"
  to = "/.netlify/functions/onboarding"
  status = 200
