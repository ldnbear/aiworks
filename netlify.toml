[build]
  functions = "netlify/functions"

[functions."content-cron"]
  schedule = "0 8 * * 1,4"

[[redirects]]
  from = "/api/claude"
  to = "/.netlify/functions/claude-proxy"
  status = 200

[[redirects]]
  from = "/api/waitlist"
  to = "/.netlify/functions/waitlist"
  status = 200

[[redirects]]
  from = "/api/waitlist-count"
  to = "/.netlify/functions/waitlist-count"
  status = 200

[[redirects]]
  from = "/api/geo-scan"
  to = "/.netlify/functions/geo-scan"
  status = 200
